name: Mobile CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build:
    name: Mobile Build & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Expo
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        if: env.EXPO_TOKEN != ''
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build --workspace=packages/shared

      - name: Type Check & Lint
        run: |
          npm run type-check --workspace=mobile
          npx eslint mobile/src --ext .ts,.tsx

      - name: EAS Build Status Notice
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        if: github.ref == 'refs/heads/main' && env.EXPO_TOKEN == ''
        run: echo "EXPO_TOKEN secret is not set in repository secrets; skipping EAS cloud build."

      - name: Build Android (EAS)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        if: github.ref == 'refs/heads/main' && env.EXPO_TOKEN != ''
        run: |
          cd mobile
          eas build --platform android --profile production --non-interactive
