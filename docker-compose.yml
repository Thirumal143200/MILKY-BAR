version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: milkboy-postgres-dev
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: milkboy_dev
    ports:
      - '5432:5432'
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: milkboy-backend-dev
    ports:
      - '4000:4000'
    environment:
      - NODE_ENV=development
      - PORT=4000
      - DB_CLIENT=sqlite3
      - DB_FILENAME=./dev.sqlite3
      - JWT_SECRET=dev_jwt_secret_milkboy_12345
      - JWT_REFRESH_SECRET=dev_refresh_secret_milkboy_67890
      - AI_SERVICE_URL=http://ai_service:8000/api/v1
    depends_on:
      ai_service:
        condition: service_healthy

  ai_service:
    build:
      context: ./ai_service
      dockerfile: Dockerfile
    container_name: milkboy-ai-dev
    ports:
      - '8000:8000'
    environment:
      - PROJECT_NAME=MilkBoy AI Service (Dev)
      - MODEL_VERSION=v1.0.0-synthetic
    volumes:
      - ./ai_service/models:/app/models

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    container_name: milkboy-web-dev
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:4000/api/v1
    depends_on:
      - backend

volumes:
  pgdata_dev:
